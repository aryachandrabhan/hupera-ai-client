
      - name: Verify source Android Manifest
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          if ! grep -q 'android:name=".MainActivity"' "$MANIFEST"; then
            echo "ERROR: MainActivity missing"
            exit 1
          fi

          if ! grep -q 'android:name="android.intent.action.MAIN"' "$MANIFEST"; then
            echo "ERROR: MAIN launcher action missing"
            exit 1
          fi

          if ! grep -q 'android:name="android.intent.category.LAUNCHER"' "$MANIFEST"; then
            echo "ERROR: LAUNCHER category missing"
            exit 1
          fi

          if ! grep -q 'android:scheme="hupera"' "$MANIFEST"; then
            echo "ERROR: Hupera URL scheme missing"
            exit 1
          fi

          if ! grep -q 'android:host="auth"' "$MANIFEST"; then
            echo "ERROR: Hupera auth host missing"
            exit 1
          fi

          echo "SUCCESS: Launcher and Hupera deep link configuration verified."
