
name: Build Hupera Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Inject Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase Android configuration installed."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set. APK will compile, but FCM registration will not work until Firebase config is added."
          fi

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Validate Android Manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          root = ET.parse(path).getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          app = root.find("application")
          assert app is not None, "Application missing"

          activity = app.find("activity")
          assert activity is not None, "Activity missing"
          assert activity.get(ns + "name") == ".MainActivity", "MainActivity missing"

          filters = activity.findall("intent-filter")

          launcher = any(
              any(x.tag == "action" and x.get(ns + "name") == "android.intent.action.MAIN" for x in f)
              and any(x.tag == "category" and x.get(ns + "name") == "android.intent.category.LAUNCHER" for x in f)
              for f in filters
          )

          deep_link = any(
              any(x.tag == "action" and x.get(ns + "name") == "android.intent.action.VIEW" for x in f)
              and any(
                  x.tag == "data"
                  and x.get(ns + "scheme") == "hupera"
                  and x.get(ns + "host") == "auth"
                  for x in f
              )
              for f in filters
          )

          assert launcher, "Launcher configuration missing"
          assert deep_link, "Hupera auth deep link missing"

          print("SUCCESS: Manifest and Hupera deep link verified.")
          PY

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hupera-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
