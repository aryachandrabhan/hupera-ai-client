
      - name: Verify source Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          root = ET.parse(path).getroot()

          ns = "{http://schemas.android.com/apk/res/android}"

          app = root.find("application")
          assert app is not None, "Application tag missing"

          activity = app.find("activity")
          assert activity is not None, "Activity missing"

          assert activity.get(ns + "name") == ".MainActivity", "MainActivity missing"

          filters = activity.findall("intent-filter")

          launcher_ok = any(
              any(x.tag == "action" and x.get(ns + "name") == "android.intent.action.MAIN" for x in f)
              and any(x.tag == "category" and x.get(ns + "name") == "android.intent.category.LAUNCHER" for x in f)
              for f in filters
          )

          deep_link_ok = any(
              any(x.tag == "action" and x.get(ns + "name") == "android.intent.action.VIEW" for x in f)
              and any(
                  x.tag == "data"
                  and x.get(ns + "scheme") == "hupera"
                  and x.get(ns + "host") == "auth"
                  for x in f
              )
              for f in filters
          )

          assert launcher_ok, "Launcher configuration missing"
          assert deep_link_ok, "Hupera auth deep link missing"

          print("SUCCESS: Launcher and Hupera deep link configuration verified.")
          PY
