name: Build Hupera Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Inject and validate Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON repository secret is missing or unavailable to this workflow."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")
          data = json.loads(path.read_text())
          project_id = data.get("project_info", {}).get("project_id")
          clients = data.get("client", [])
          expected = "com.hupera.ai.client"
          matches = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in clients
          ]

          assert project_id, "Firebase project_id is missing"
          assert expected in matches, (
              f"Firebase config does not contain Android package {expected}. "
              f"Found: {matches}"
          )
          print("SUCCESS: Firebase JSON is valid and package name matches.")
          PY

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Validate Android Manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          root = ET.parse(path).getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          app = root.find("application")
          assert app is not None, "Application missing"

          activity = app.find("activity")
          assert activity is not None, "Activity missing"
          assert activity.get(ns + "name") == ".MainActivity", "MainActivity missing"

          filters = activity.findall("intent-filter")

          launcher = any(
              any(x.tag == "action" and x.get(ns + "name") == "android.intent.action.MAIN" for x in f)
              and any(x.tag == "category" and x.get(ns + "name") == "android.intent.category.LAUNCHER" for x in f)
              for f in filters
          )

          deep_link = any(
              any(x.tag == "action" and x.get(ns + "name") == "android.intent.action.VIEW" for x in f)
              and any(
                  x.tag == "data"
                  and x.get(ns + "scheme") == "hupera"
                  and x.get(ns + "host") == "auth"
                  for x in f
              )
              for f in filters
          )

          assert launcher, "Launcher configuration missing"
          assert deep_link, "Hupera auth deep link missing"

          print("SUCCESS: Manifest and Hupera deep link verified.")
          PY

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hupera-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
